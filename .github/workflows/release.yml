name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. v0.6.0'
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # `npm ci` runs dependency install scripts, so packaging stays out of the job
  # that can sign in to Entra ID.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check tag matches package.json
        run: |
          pkg="v$(node -p 'require("./package.json").version')"
          [ "$pkg" = "$TAG" ] || { echo "::error::tag $TAG != package.json $pkg"; exit 1; }

      - run: npm ci

      - name: Package
        run: npx @vscode/vsce package -o "dtach-sessions-${TAG#v}.vsix"

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dtach-sessions-*.vsix
          retention-days: 7

  # No stored credential: GitHub's OIDC token is exchanged for an Entra ID token
  # via a federated credential that trusts only the `marketplace` environment.
  publish:
    needs: package
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to VS Marketplace
        run: npx --yes @vscode/vsce publish --azure-credential --skip-duplicate --packagePath "dtach-sessions-${TAG#v}.vsix"

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${TAG#v}"
          # This version's CHANGELOG section, heading excluded.
          awk -v v="$ver" '
            /^## \[/ { if (on) exit; on = index($0, "[" v "]") > 0; next }
            on' CHANGELOG.md > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dtach-sessions-$ver.vsix" --clobber
          else
            gh release create "$TAG" "dtach-sessions-$ver.vsix" --title "$TAG" --notes-file notes.md --verify-tag
          fi
